<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridentis Laboratório</title>
<meta name="description" content="Prótese odontológica de alta precisão e estética dental.">
<meta name="theme-color" content="#5f28a7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Urbanist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-1: #7d50b7;
    --purple-2: #400096;
    --gradient: linear-gradient(135deg, var(--purple-1) 0%, #5f28a7 45%, var(--purple-2) 100%);
    --outside: #ffffff;
    --card: #ffffff;
    --link-border: #d9d9d9;
    --link-text: #a6a6a6;
    --link-hover: #5f28a7;
    --font: "Urbanist", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --font-logo: "Inter", "Segoe UI", system-ui, Arial, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --outside: #12081f; }
  }
  :root[data-theme="dark"] { --outside: #12081f; }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font);
    color: #fff;
    background: var(--gradient) fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- MOBILE (base) ---------- */
  .page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(40px, 9vh, 72px);
    padding: 40px 20px;
    width: 100%;
    max-width: 100%;
  }

  .brand { text-align: center; }
  .logo {
    display: block;
    width: clamp(220px, 64vw, 270px);
    height: auto;
    margin: 0 auto 24px;
  }
  .tagline {
    margin: 0 auto;
    max-width: 21em;
    font-size: clamp(19px, 5.4vw, 23px);
    font-weight: 400;
    line-height: 1.5;
    text-wrap: balance;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 11px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    padding: 12px 20px;
    background: #fff;
    border: 2px solid var(--link-border);
    border-radius: 10px;
    color: var(--link-text);
    font-size: 21px;
    font-weight: 400;
    text-decoration: none;
    text-align: center;
    transition: transform .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .link:hover {
    color: var(--link-hover);
    border-color: var(--link-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(30, 0, 70, .25);
  }
  .link:active { transform: translateY(0); }
  .link:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- TABLET: cartão roxo centralizado sobre fundo claro ---------- */
  @media (min-width: 600px) {
    body { background: var(--outside); }
    .page {
      min-height: calc(100dvh - 72px);
      margin: 36px auto;
      max-width: 560px;
      border-radius: 10px;
      background: var(--gradient);
      padding: 56px 26px;
    }
    .logo { width: 300px; }
  }

  /* ---------- DESKTOP: layout dividido ---------- */
  @media (min-width: 900px) {
    body { background: var(--gradient) fixed; }
    .page {
      max-width: 1180px;
      min-height: 100dvh;
      margin: 0 auto;
      border-radius: 0;
      background: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 56px;
      padding: 48px 40px;
    }
    .brand { padding: 0 12px; }
    .logo { width: clamp(330px, 32vw, 420px); margin-bottom: 28px; }
    .tagline { font-size: clamp(20px, 1.7vw, 23px); max-width: 20em; }

    .links-card {
      background: var(--card);
      border-radius: 28px;
      padding: 60px 21px;
      width: 100%;
      max-width: 561px;
      justify-self: center;
      box-shadow: 0 24px 60px rgba(20, 0, 60, .28);
    }
    .links { gap: 16px; max-width: none; }
    .link {
      min-height: 94px;
      border-radius: 14px;
      font-size: 27px;
      font-weight: 300;
    }
  }

  @media (min-width: 900px) and (max-height: 760px) {
    .links-card { padding: 36px 21px; }
    .link { min-height: 78px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .link:hover { transform: none; }
  }
</style>
</head>
